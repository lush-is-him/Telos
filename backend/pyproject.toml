[project]
name = "telos"
version = "1.0.0"
description = "Telos home server (sync + backup) and ML pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2",
  "pandas>=2.2",
  "numpy>=2",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "joblib>=1.4",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "nbformat", "nbconvert", "ipykernel"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["telos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines are handled by the formatter's 120 limit
